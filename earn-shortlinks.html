<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortlinks — Vexora International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <div class="top-nav">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="balance-pill">
      <span class="balance-icon">💰</span>
      <div>
        <div class="label">Balance</div>
        <div class="amount" id="balance-amount">0 Token</div>
      </div>
    </div>
  </div>

  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-close" onclick="toggleMenu()">✕</div>
    <div class="drawer-user">
      <img id="user-pic" src="https://api.dicebear.com/7.x/initials/svg?seed=U" alt="">
      <div>
        <div class="drawer-user-name" id="user-name">User</div>
        <div class="drawer-user-email" id="user-email">—</div>
      </div>
    </div>

    <div class="logo">Vexora <span>Intl.</span></div>
    <div class="tagline">Earning Platform</div>


    <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span class="label">Home</span></a>
    <a class="nav-item active" href="earn-hub.html"><span class="icon">💎</span><span class="label">Earn Money</span></a>
    <a class="nav-item" href="withdraw.html"><span class="icon">💳</span><span class="label">Withdrawal System</span></a>
    <a class="nav-item" href="advertising.html"><span class="icon">📢</span><span class="label">Advertising Board</span></a>
    <a class="nav-item" href="referrals.html"><span class="icon">🤝</span><span class="label">Referral Program</span></a>
    <a class="nav-item" href="prize-pool.html"><span class="icon">🏆</span><span class="label">Daily Prize Pool</span></a>

    <div class="drawer-footer">
      <a class="nav-item" href="#" onclick="clearSession(); window.location.href='index.html';">
        <span class="icon">🚪</span><span class="label">Logout</span>
      </a>
    </div>
  </aside>

  <div class="main-content">
    <div class="page-head">
      <a href="earn-hub.html" style="color:var(--text-dim); font-size:0.85rem;">← Back to Earn Money</a>
      <h2 style="margin-top:8px;">🔗 Shortlinks</h2>
      <p style="color:var(--text-dim); font-size:0.9rem;">Open a link, wait for the required time, then come back to claim your reward.</p>
    </div>

    <div class="grid grid-3" id="links-container">
      <div class="card" style="grid-column:1/-1; text-align:center; color:var(--text-dim);">Loading links...</div>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
  const user = requireLogin();

  if (user) {
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-email').innerText = user.email;
    document.getElementById('user-pic').src = user.picture || `https://api.dicebear.com/7.x/initials/svg?seed=${user.name}`;

    apiGet('getUserFull', { email: user.email }).then(res => {
      if (res.success) document.getElementById('balance-amount').innerText = formatTokens(res.user.Balance || 0);
    });
    loadLinks();
  }

  // Keep the full link objects in memory, keyed by LinkID — safer than
  // embedding raw JSON inside an onclick="" attribute, which silently
  // breaks if a Title or URL ever contains a quote character.
  let linksById = {};

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function loadLinks() {
    const res = await apiGet('getShortlinks');
    const container = document.getElementById('links-container');
    if (res.success && res.shortlinks.length) {
      linksById = {};
      res.shortlinks.forEach(link => { linksById[link.LinkID] = link; });

      container.innerHTML = res.shortlinks.map(link => `
        <div class="ad-card">
          <div class="ad-card-top">
            <span class="duration-tag">Shortlink</span>
            <span class="price-tag">${formatTokens(link.Reward)}</span>
          </div>
          <div style="font-weight:600;">${escapeHtml(link.Title)}</div>
          <button class="btn btn-gold btn-block" data-link-id="${escapeHtml(link.LinkID)}" onclick="goToLink(this.dataset.linkId)">Open Link</button>
          <button class="btn btn-outline btn-block" data-link-id="${escapeHtml(link.LinkID)}" onclick="claimLink(this.dataset.linkId, this)">Claim After Returning</button>
          <div class="link-msg" id="msg-${escapeHtml(link.LinkID)}" style="margin-top:8px; font-size:0.82rem; min-height:1.2em;"></div>
        </div>
      `).join('');
    } else {
      container.innerHTML = '<div class="card" style="grid-column:1/-1; text-align:center; color:var(--text-dim);">No shortlinks available right now.</div>';
    }
  }

  function goToLink(linkId) {
    const link = linksById[linkId];
    if (!link) return;
    window.open(link.ShortURL || link.OriginalURL, '_blank');
  }

  async function claimLink(linkId, btn) {
    const msg = document.getElementById('msg-' + linkId);
    btn.disabled = true;
    const originalText = btn.innerText;
    btn.innerText = 'Claiming...';
    if (msg) { msg.style.color = 'var(--text-dim)'; msg.innerText = ''; }

    try {
      const res = await apiPost('completeShortlink', { linkId });
      if (res.success) {
        if (msg) { msg.style.color = 'var(--success)'; msg.innerText = '+' + formatTokens(res.reward) + ' credited!'; }
        apiGet('getUserFull', { email: user.email }).then(r => {
          if (r.success) document.getElementById('balance-amount').innerText = formatTokens(r.user.Balance || 0);
        });
      } else {
        if (msg) { msg.style.color = 'var(--danger)'; msg.innerText = res.error || 'Something went wrong.'; }
      }
    } catch (err) {
      if (msg) { msg.style.color = 'var(--danger)'; msg.innerText = 'Network error, please try again.'; }
    } finally {
      btn.disabled = false;
      btn.innerText = originalText;
    }
  }
</script>

</body>
</html>
