<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel — Vexora International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom: 80px; }
  .a-top { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }
  .a-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
  .a-bar b { font-family: 'Sora', sans-serif; font-size: 1.05rem; }
  .a-bar a, .a-bar button { color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: .85rem; text-decoration: none; cursor: pointer; }
  .a-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .a-tabs::-webkit-scrollbar { display: none; }
  .a-tab { flex: 0 0 auto; position: relative; background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; font-size: .88rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .a-tab.on { background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: #16182C; border-color: transparent; }
  .a-tab .bd { display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 6px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .7rem; font-weight: 700; text-align: center; }
  .a-main { max-width: 720px; margin: 0 auto; padding: 14px; }
  .a-h { font-family: 'Sora', sans-serif; font-size: 1.05rem; margin: 6px 0 10px; }
  .a-sub { color: var(--text-dim); font-size: .82rem; margin-bottom: 12px; }
  .a-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .a-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .a-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; text-align: left; cursor: pointer; color: var(--text); font: inherit; }
  .a-stat .n { font-family: 'Sora', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--gold-bright); }
  .a-stat .l { font-size: .78rem; color: var(--text-dim); margin-top: 2px; }
  .a-stat.hot { border-color: var(--danger); }
  .a-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .a-muted { color: var(--text-dim); font-size: .8rem; word-break: break-word; }
  .a-big { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--gold-bright); }
  .a-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .a-btn { flex: 1 1 auto; min-height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-weight: 600; font-size: .86rem; padding: 8px 12px; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .a-btn.ok { background: rgba(74,222,128,.16); border-color: rgba(74,222,128,.6); color: #bbf7d0; }
  .a-btn.bad { background: rgba(255,138,138,.14); border-color: rgba(255,138,138,.6); color: #ffd1d1; }
  .a-btn.gold { background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: #16182C; border-color: transparent; }
  .a-btn:disabled { opacity: .5; cursor: wait; }
  .a-btn.sm { flex: 0 0 auto; min-height: 32px; padding: 4px 10px; font-size: .78rem; }
  .a-in, .a-ta, .a-sel { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; margin-top: 6px; }
  .a-ta { resize: vertical; min-height: 70px; }
  .a-lab { display: block; font-size: .8rem; color: var(--text-dim); margin-top: 10px; }
  .a-chips { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .a-pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; border: 1px solid var(--border); }
  .a-pill.g { color: #bbf7d0; border-color: rgba(74,222,128,.6); } .a-pill.r { color: #ffd1d1; border-color: rgba(255,138,138,.6); }
  .a-pill.y { color: #ffe08a; border-color: rgba(255,201,77,.6); } .a-pill.b { color: #bae6fd; border-color: rgba(56,189,248,.6); }
  .bubble { padding: 10px 12px; border-radius: 12px; margin-top: 8px; white-space: pre-wrap; word-break: break-word; font-size: .92rem; }
  .bubble.u { background: var(--surface-3); } .bubble.a { background: rgba(62,230,208,.12); border: 1px solid rgba(62,230,208,.4); }
  .bar { height: 7px; background: var(--surface-3); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold-bright)); }
  details.a-card > summary { cursor: pointer; font-weight: 700; list-style: none; }
  details.a-card > summary::-webkit-details-marker { display: none; }
  #toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 99; max-width: 92vw; padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: .9rem; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .empty { text-align: center; color: var(--text-dim); padding: 30px 10px; }
</style>
</head>
<body>

<div class="a-top">
  <div class="a-bar">
    <a href="dashboard.html">← Site</a>
    <b>🛠 Admin Panel</b>
    <button id="refresh-btn" data-act="refresh">↻</button>
  </div>
  <div class="a-tabs" id="tabs"></div>
</div>

<main class="a-main" id="view"><div class="empty">Loading...</div></main>
<div id="toast"></div>

<script src="config.js"></script>
<script>
  const user = requireLogin();
  const TABS = [['home','🏠','Home'], ['support','💬','Support'], ['wd','💳','Withdrawals'], ['pay','📢','Payments'],
                ['ads','🎬','PTC Ads'], ['links','🔗','Shortlinks'], ['walls','🎁','Offerwalls'], ['users','👥','Users']];
  const REWARD = { '5': 20, '10': 30, '30': 50, '60': 75 };
  const UNLIMITED = 999999999;
  let tab = 'home';
  const filt = { wd: 'Pending', pay: 'Pending' };
  let badges = {};
  let userQuery = '';

  // ---------------- helpers ----------------
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function when(ms) { return ms ? new Date(ms).toLocaleString() : ''; }
  function $(id) { return document.getElementById(id); }
  function val(id) { const el = $(id); return el ? el.value.trim() : ''; }
  function pill(text, cls) { return '<span class="a-pill ' + cls + '">' + esc(text) + '</span>'; }
  function statusPill(s) {
    const k = String(s).toLowerCase();
    const cls = /^(approved|active|answered)$/.test(k) ? 'g' : /^(rejected|banned)$/.test(k) ? 'r' : /^(pending|pending_review|paused)$/.test(k) ? 'y' : 'b';
    return pill(s, cls);
  }
  let toastTimer;
  function toast(msg, ok) {
    const t = $('toast');
    t.innerText = msg;
    t.style.background = ok === false ? '#7f1d1d' : '#14532d';
    t.style.color = '#fff';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
  }
  function showDenied() {
    $('tabs').innerHTML = '';
    $('view').innerHTML = '<div class="a-card empty"><div style="font-size:2rem;">🔒</div><b>Admins only</b><p class="a-muted" style="margin-top:6px;">This page is only for the site admin.<br>' +
      'To become admin, write <b>admin</b> in the <b>Role</b> column of your row in the Users sheet, then log out and log in again.</p></div>';
  }
  async function call(kind, action, payload) {
    try {
      const res = kind === 'get' ? await apiGet(action, payload || {}) : await apiPost(action, payload || {});
      if (res && res.error === 'Not authorized.') { showDenied(); return null; }
      return res;
    } catch (e) {
      toast('Network error. Please try again.', false);
      return null;
    }
  }
  function failMsg(res) { return (res && res.error) ? res.error : 'Something went wrong.'; }

  // ---------------- tabs ----------------
  function renderTabs() {
    $('tabs').innerHTML = TABS.map(t => {
      const n = badges[t[0]] || 0;
      return '<button class="a-tab' + (t[0] === tab ? ' on' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + ' ' + t[2] +
             (n ? '<span class="bd">' + n + '</span>' : '') + '</button>';
    }).join('');
  }
  function setBadges(o) {
    badges = { support: o.supportWaiting, wd: o.pendingWithdrawals, pay: o.pendingDeposits, ads: o.adsToReview };
    renderTabs();
  }
  async function refreshBadges() {
    const r = await call('get', 'adminOverview');
    if (r && r.success) setBadges(r);
    return r;
  }
  async function showTab(name) {
    tab = name;
    renderTabs();
    $('view').innerHTML = '<div class="empty">Loading...</div>';
    const loaders = { home: loadHome, support: loadSupport, wd: loadWithdrawals, pay: loadPayments, ads: loadAds, links: loadLinks, walls: loadWalls, users: loadUsers };
    await loaders[name]();
    window.scrollTo(0, 0);
  }

  // ---------------- HOME ----------------
  function renderHome(o) {
    const stat = (n, label, go, hot) => '<button class="a-stat' + (hot && n > 0 ? ' hot' : '') + '" data-act="tab" data-tab="' + go + '"><div class="n">' + esc(n) + '</div><div class="l">' + esc(label) + '</div></button>';
    return '<div class="a-h">Today at a glance</div><div class="a-grid">' +
      stat(o.supportWaiting, '💬 Messages waiting', 'support', true) +
      stat(o.pendingWithdrawals, '💳 Withdrawals pending', 'wd', true) +
      stat(o.pendingDeposits, '📢 Payments to approve', 'pay', true) +
      stat(o.adsToReview, '🎬 Ads to review', 'ads', true) +
      stat(o.activeAds, '▶️ Active ads', 'ads', false) +
      stat(o.users, '👥 Users', 'users', false) + '</div>' +
      '<div class="a-card" style="margin-top:12px;"><div class="a-muted">Total tokens held by users</div><div class="a-big">' + esc(formatTokens(o.totalBalance)) + '</div></div>' +
      '<p class="a-sub">Tap a box to open that section. Red outline = something is waiting for you.</p>';
  }
  async function loadHome() {
    const r = await refreshBadges();
    if (!r) return;
    $('view').innerHTML = r.success ? renderHome(r) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
  }

  // ---------------- SUPPORT ----------------
  function renderSupport(list) {
    if (!list.length) return '<div class="a-card empty">No messages yet.</div>';
    return '<div class="a-sub">Waiting messages are on top. Type your reply under a message and press Send. The user sees it in his Support chat.</div>' +
      list.map(m => '<div class="a-card">' +
        '<div class="a-row"><b>' + esc(m.Name) + '</b>' + (m.Reply ? pill('answered', 'g') : pill('waiting', 'y')) + '</div>' +
        '<div class="a-muted">' + esc(m.Email) + ' · ' + esc(when(m.CreatedAt)) + '</div>' +
        '<div class="bubble u">' + esc(m.Message) + '</div>' +
        (m.Reply ? '<div class="bubble a">' + esc(m.Reply) + '</div>' : '') +
        '<textarea class="a-ta" id="rep-' + esc(m.MessageID) + '" placeholder="Write your reply..." maxlength="1000"></textarea>' +
        '<div class="a-btns"><button class="a-btn gold" data-act="sup-reply" data-id="' + esc(m.MessageID) + '">' + (m.Reply ? 'Send a new reply' : 'Send reply') + '</button></div></div>').join('');
  }
  async function loadSupport() {
    const r = await call('get', 'adminSupport');
    if (!r) return;
    $('view').innerHTML = r.success ? renderSupport(r.messages) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
  }

  // ---------------- WITHDRAWALS ----------------
  function chips(group, current) {
    return '<div class="a-chips">' + ['Pending', 'Approved', 'Rejected'].map(s =>
      '<button class="a-btn sm' + (s === current ? ' gold' : '') + '" data-act="filter" data-group="' + group + '" data-val="' + s + '">' + s + '</button>').join('') + '</div>';
  }
  function renderWithdrawals(rows, status) {
    let html = '<div class="a-h">Withdrawals</div>' + chips('wd', status);
    if (!rows.length) return html + '<div class="a-card empty">Nothing ' + esc(status.toLowerCase()) + '.</div>';
    html += rows.map(w => {
      const isFp = /faucetpay/i.test(w.Method);
      const payout = w.PayoutValue ? w.PayoutValue.toFixed(w.PayoutCurrency === 'LTC' ? 6 : 2) + ' ' + w.PayoutCurrency : '';
      return '<div class="a-card">' +
        '<div class="a-row"><span class="a-big">' + esc(formatTokens(w.TokenAmount)) + '</span>' + statusPill(w.Status) + '</div>' +
        '<div><b>' + esc(w.Name) + '</b> <span class="a-muted">' + esc(w.Email) + '</span></div>' +
        '<div class="a-muted">' + esc(w.Method) + (payout ? ' · pays ' + esc(payout) : '') + '</div>' +
        '<div class="a-row" style="margin-top:6px;"><span class="a-muted" style="flex:1;">' + esc(w.WalletAddress) + '</span>' +
        '<button class="a-btn sm" data-act="copy" data-copy="' + esc(w.WalletAddress) + '">Copy</button></div>' +
        '<div class="a-muted">' + esc(when(w.RequestedAt)) + '</div>' +
        (w.Status === 'Pending' ? '<div class="a-btns">' +
          (isFp ? '<button class="a-btn gold" data-act="wd" data-op="pay" data-id="' + esc(w.WithdrawID) + '">💸 Pay now (FaucetPay)</button>' : '') +
          '<button class="a-btn ok" data-act="wd" data-op="approve" data-id="' + esc(w.WithdrawID) + '">✅ Mark as paid</button>' +
          '<button class="a-btn bad" data-act="wd" data-op="reject" data-id="' + esc(w.WithdrawID) + '">❌ Reject</button></div>' : '') +
        '</div>';
    }).join('');
    return html;
  }
  async function loadWithdrawals() {
    const r = await call('get', 'adminWithdrawals', { status: filt.wd });
    if (!r) return;
    $('view').innerHTML = r.success ? renderWithdrawals(r.withdrawals, filt.wd) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
  }

  // ---------------- PAYMENTS ----------------
  function renderPayments(rows, status) {
    let html = '<div class="a-h">Ad payments</div><div class="a-sub">Check the money really arrived in your FaucetPay / wallet before you approve.</div>' + chips('pay', status);
    if (!rows.length) return html + '<div class="a-card empty">Nothing ' + esc(status.toLowerCase()) + '.</div>';
    return html + rows.map(d => '<div class="a-card">' +
      '<div class="a-row"><span class="a-big">$' + esc(d.Amount.toFixed(2)) + '</span>' + statusPill(d.Status) + '</div>' +
      '<div><b>' + esc(d.Name) + '</b> <span class="a-muted">' + esc(d.Email) + '</span></div>' +
      '<div class="a-muted">' + esc(d.Method) + ' · ' + esc(when(d.Timestamp)) + '</div>' +
      (d.Reference ? '<div class="a-muted">Ref: ' + esc(d.Reference) + '</div>' : '') +
      '<div class="a-btns">' + (d.ProofUrl ? '<a class="a-btn" href="' + esc(d.ProofUrl) + '" target="_blank" rel="noopener noreferrer">🖼 View proof</a>' : '') +
      (d.Status === 'Pending' ? '<button class="a-btn ok" data-act="dep" data-op="approve" data-id="' + esc(d.TxnID) + '">✅ Approve</button>' +
        '<button class="a-btn bad" data-act="dep" data-op="reject" data-id="' + esc(d.TxnID) + '">❌ Reject</button>' : '') + '</div></div>').join('');
  }
  async function loadPayments() {
    const r = await call('get', 'adminDeposits', { status: filt.pay });
    if (!r) return;
    $('view').innerHTML = r.success ? renderPayments(r.deposits, filt.pay) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
  }

  // ---------------- PTC ADS ----------------
  function adCard(a) {
    const unlimited = a.TotalViews >= UNLIMITED;
    const pct = unlimited ? 0 : Math.min(100, Math.round((a.ViewsUsed / Math.max(1, a.TotalViews)) * 100));
    let btns = '';
    if (a.Status === 'pending_review' || a.Status === 'paused') btns += '<button class="a-btn ok" data-act="ad" data-op="activate" data-id="' + esc(a.AdID) + '">▶️ Activate</button>';
    if (a.Status === 'active') btns += '<button class="a-btn" data-act="ad" data-op="pause" data-id="' + esc(a.AdID) + '">⏸ Pause</button>';
    if (a.Status !== 'rejected' && a.Status !== 'completed') btns += '<button class="a-btn bad" data-act="ad" data-op="reject" data-id="' + esc(a.AdID) + '">❌ Reject</button>';
    return '<div class="a-card">' +
      '<div class="a-row"><b>' + esc(a.Title) + '</b>' + statusPill(a.Status) + '</div>' +
      '<div class="a-muted"><a href="' + esc(a.TargetURL) + '" target="_blank" rel="noopener noreferrer" style="color:var(--teal);">' + esc(a.TargetURL) + '</a></div>' +
      '<div class="a-muted">' + (a.Advertiser === 'admin' ? 'Your ad' : esc(a.Advertiser)) + ' · ' + esc(a.Duration) + 's · user gets ' + esc(REWARD[String(a.Duration)] || 0) + ' Token</div>' +
      '<div class="a-muted">Views: ' + esc(a.ViewsUsed) + ' / ' + (unlimited ? '∞' : esc(a.TotalViews)) +
        (a.CostUSDT ? ' · paid $' + esc(a.CostUSDT.toFixed(4)) + (a.RemainingUSDT !== null ? ', left $' + esc(a.RemainingUSDT.toFixed(4)) : '') : '') + '</div>' +
      (unlimited ? '' : '<div class="bar"><i style="width:' + pct + '%"></i></div>') +
      (btns ? '<div class="a-btns">' + btns + '</div>' : '') + '</div>';
  }
  function renderAds(ads) {
    const form = '<details class="a-card"><summary>➕ Add my own ad</summary>' +
      '<label class="a-lab">Title</label><input class="a-in" id="nad-title" maxlength="80" placeholder="e.g. My Telegram channel">' +
      '<label class="a-lab">Link (must start with https://)</label><input class="a-in" id="nad-url" inputmode="url" placeholder="https://...">' +
      '<label class="a-lab">Timer</label><select class="a-sel" id="nad-dur"><option value="5">5 seconds (20 Token)</option><option value="10" selected>10 seconds (30 Token)</option><option value="30">30 seconds (50 Token)</option><option value="60">60 seconds (75 Token)</option></select>' +
      '<label class="a-lab"><input type="checkbox" id="nad-unl" checked> Never ends (unlimited views)</label>' +
      '<div id="nad-views-wrap" style="display:none;"><label class="a-lab">Number of views</label><input class="a-in" id="nad-views" type="number" inputmode="numeric" min="1" placeholder="e.g. 5000"></div>' +
      '<div class="a-btns"><button class="a-btn gold" data-act="ad-add">Add ad</button></div>' +
      '<div class="a-muted" style="margin-top:8px;">Your ads cost nothing. Each user can watch each ad once every 24 hours.</div></details>';
    const group = (title, list) => list.length ? '<div class="a-h">' + title + ' (' + list.length + ')</div>' + list.map(adCard).join('') : '';
    const pending = ads.filter(a => a.Status === 'pending_review');
    const active = ads.filter(a => a.Status === 'active');
    const paused = ads.filter(a => a.Status === 'paused');
    const done = ads.filter(a => a.Status === 'rejected' || a.Status === 'completed').slice(0, 10);
    return '<div class="a-h">PTC Ads</div>' + form + group('⏳ Waiting for your review', pending) + group('▶️ Active', active) + group('⏸ Paused', paused) + group('Finished / rejected (last 10)', done) +
      (ads.length ? '' : '<div class="a-card empty">No ads yet.</div>');
  }
  async function loadAds() {
    const r = await call('get', 'adminAds');
    if (!r) return;
    $('view').innerHTML = r.success ? renderAds(r.ads) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
    const unl = $('nad-unl');
    if (unl) unl.addEventListener('change', () => { $('nad-views-wrap').style.display = unl.checked ? 'none' : 'block'; });
  }

  // ---------------- SHORTLINKS ----------------
  function linkCard(l) {
    const id = esc(l.LinkID);
    return '<div class="a-card"><div class="a-row"><b>' + id + '</b>' + statusPill(l.Status) + '</div>' +
      '<label class="a-lab">Title</label><input class="a-in" id="sl-title-' + id + '" value="' + esc(l.Title) + '" maxlength="60">' +
      '<label class="a-lab">Short link</label><input class="a-in" id="sl-url-' + id + '" value="' + esc(l.ShortURL) + '" inputmode="url">' +
      '<label class="a-lab">Reward (Token)</label><input class="a-in" id="sl-rew-' + id + '" type="number" inputmode="numeric" value="' + esc(l.Reward) + '">' +
      '<div class="a-muted" style="margin-top:8px;">Destination used in the shortener:<br>' + esc(l.OriginalURL) + '</div>' +
      '<div class="a-btns"><button class="a-btn gold" data-act="sl-save" data-id="' + id + '" data-status="' + esc(l.Status) + '">Save</button>' +
      '<button class="a-btn" data-act="sl-save" data-id="' + id + '" data-status="' + (l.Status === 'active' ? 'inactive' : 'active') + '">' + (l.Status === 'active' ? '⏸ Turn off' : '▶️ Turn on') + '</button>' +
      '<button class="a-btn sm" data-act="copy" data-copy="' + esc(l.OriginalURL) + '">Copy destination</button></div></div>';
  }
  function renderLinks(links) {
    return '<div class="a-h">Shortlinks</div>' +
      '<div class="a-card"><b>➕ Add a new shortlink</b><div class="a-sub" style="margin-top:6px;">1) Tap the button to get the destination. 2) Make a short link with it on your shortener site. 3) Come back and paste the short link here.</div>' +
      '<div class="a-btns"><button class="a-btn gold" data-act="sl-new">Get destination link</button></div><div id="sl-new-box"></div></div>' +
      (links.length ? links.map(linkCard).join('') : '<div class="a-card empty">No shortlinks yet.</div>') +
      '<p class="a-sub">Note: a shortlink reward can be claimed without finishing the shortener, so keep the reward lower than what the shortener pays you.</p>';
  }
  function renderNewLink(n) {
    return '<div style="margin-top:12px;"><div class="a-muted">Destination for <b>' + esc(n.linkId) + '</b> (put this in your shortener):</div>' +
      '<div class="bubble u" style="word-break:break-all;">' + esc(n.destination) + '</div>' +
      '<div class="a-btns"><button class="a-btn" data-act="copy" data-copy="' + esc(n.destination) + '">Copy destination</button></div>' +
      '<label class="a-lab">Your short link (https://...)</label><input class="a-in" id="nl-url" inputmode="url" placeholder="https://ouo.io/...">' +
      '<label class="a-lab">Title</label><input class="a-in" id="nl-title" maxlength="60" value="Link ' + esc(n.linkId.replace('SL', '')) + '">' +
      '<label class="a-lab">Reward (Token)</label><input class="a-in" id="nl-rew" type="number" inputmode="numeric" placeholder="e.g. 75">' +
      '<div class="a-btns"><button class="a-btn ok" data-act="sl-create" data-id="' + esc(n.linkId) + '">Save link</button></div></div>';
  }
  async function loadLinks() {
    const r = await call('get', 'adminShortlinks');
    if (!r) return;
    $('view').innerHTML = r.success ? renderLinks(r.links) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
  }

  // ---------------- OFFERWALLS ----------------
  function renderWalls(walls) {
    return '<div class="a-h">Offerwalls</div><div class="a-sub">You can switch a wall on or off and change its Token number here. To add a brand-new wall use the Offerwalls tab of the Google Sheet (it holds secret keys).</div>' +
      (walls.length ? walls.map(w => {
        const id = esc(w.WallID);
        return '<div class="a-card"><div class="a-row"><b>' + esc(w.ProviderName) + '</b>' + statusPill(w.Status) + '</div><div class="a-muted">' + id + '</div>' +
          '<label class="a-lab">Token multiplier (user share % × 100,000, e.g. 50000 = 50%)</label>' +
          '<input class="a-in" id="w-mult-' + id + '" type="number" inputmode="numeric" value="' + esc(w.TokenMultiplier) + '">' +
          '<div class="a-btns"><button class="a-btn gold" data-act="wall" data-id="' + id + '" data-status="' + esc(w.Status) + '">Save</button>' +
          '<button class="a-btn" data-act="wall" data-id="' + id + '" data-status="' + (w.Status === 'active' ? 'inactive' : 'active') + '">' + (w.Status === 'active' ? '⏸ Turn off' : '▶️ Turn on') + '</button></div></div>';
      }).join('') : '<div class="a-card empty">No offerwalls.</div>');
  }
  async function loadWalls() {
    const r = await call('get', 'adminOfferwalls');
    if (!r) return;
    $('view').innerHTML = r.success ? renderWalls(r.walls) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
  }

  // ---------------- USERS ----------------
  function renderUsers(users, q) {
    const search = '<div class="a-h">Users</div><div class="a-card"><label class="a-lab" style="margin-top:0;">Search by name, email or user id</label>' +
      '<input class="a-in" id="u-q" value="' + esc(q) + '" placeholder="e.g. ali@gmail.com"><div class="a-btns"><button class="a-btn gold" data-act="user-search">🔍 Search</button></div></div>';
    if (!users.length) return search + '<div class="a-card empty">No users found.</div>';
    return search + '<div class="a-sub">' + (q ? 'Results' : 'Newest users') + '</div>' + users.map(u => {
      const id = esc(u.UserID);
      const isAdmin = String(u.Role).toLowerCase() === 'admin';
      return '<div class="a-card"><div class="a-row"><b>' + esc(u.Name) + '</b>' + statusPill(u.Status) + '</div>' +
        '<div class="a-muted">' + esc(u.Email) + '</div>' + (u.Telegram ? '<div class="a-muted">✈️ ' + esc(u.Telegram) + '</div>' : '') + '<div class="a-muted">' + id + (isAdmin ? ' · admin' : '') + ' · joined ' + esc(when(u.CreatedAt)) + '</div>' +
        '<div class="a-big" style="margin-top:6px;">' + esc(formatTokens(u.Balance)) + '</div>' +
        '<label class="a-lab">Add or remove Tokens (use - to remove)</label>' +
        '<div style="display:flex; gap:8px;"><input class="a-in" id="adj-amt-' + id + '" type="number" inputmode="numeric" placeholder="e.g. 500 or -500" style="flex:1;">' +
        '<input class="a-in" id="adj-why-' + id + '" placeholder="Reason" maxlength="100" style="flex:1.4;"></div>' +
        '<div class="a-btns"><button class="a-btn gold" data-act="user-adjust" data-id="' + id + '">Apply</button>' +
        (u.Telegram ? '<button class="a-btn" data-act="user-ban" data-op="unlinkTelegram" data-id="' + id + '">Unlink Telegram</button>' : '') +
        (isAdmin ? '' : (String(u.Status).toLowerCase() === 'banned'
          ? '<button class="a-btn ok" data-act="user-ban" data-op="unban" data-id="' + id + '">Unban</button>'
          : '<button class="a-btn bad" data-act="user-ban" data-op="ban" data-id="' + id + '">🚫 Ban</button>')) + '</div></div>';
    }).join('');
  }
  async function loadUsers() {
    const r = await call('get', 'adminUsers', { q: userQuery });
    if (!r) return;
    $('view').innerHTML = r.success ? renderUsers(r.users, userQuery) : '<div class="a-card empty">' + esc(failMsg(r)) + '</div>';
  }

  // ---------------- actions ----------------
  async function run(btn, fn) {
    if (btn) btn.disabled = true;
    try { await fn(); } finally { if (btn) btn.disabled = false; }
  }
  async function afterAction(res, okText) {
    if (res && res.success) { toast(res.message || okText || 'Done', true); await showTab(tab); refreshBadges(); }
    else if (res) toast(failMsg(res), false);
  }

  document.addEventListener('click', function (e) {
    const b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id, op = b.dataset.op;

    if (act === 'tab') return showTab(b.dataset.tab);
    if (act === 'refresh') return showTab(tab);
    if (act === 'filter') { filt[b.dataset.group] = b.dataset.val; return showTab(tab); }
    if (act === 'copy') {
      if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy || '');
      return toast('Copied', true);
    }

    run(b, async () => {
      if (act === 'sup-reply') {
        const reply = val('rep-' + id);
        if (!reply) return toast('Write a reply first.', false);
        return afterAction(await call('post', 'adminReplySupport', { messageId: id, reply: reply }), 'Reply sent');
      }
      if (act === 'wd') {
        const msg = { approve: 'Mark this withdrawal as PAID? (Only do this after you sent the money.)', reject: 'Reject and give the Tokens back to the user?', pay: 'Send the LTC now through FaucetPay?' }[op];
        if (!confirm(msg)) return;
        return afterAction(await call('post', 'adminWithdrawalAction', { withdrawId: id, op: op }));
      }
      if (act === 'dep') {
        if (!confirm(op === 'approve' ? 'Approve this payment? Only after the money reached you.' : 'Reject this payment?')) return;
        return afterAction(await call('post', 'adminDepositAction', { txnId: id, op: op }));
      }
      if (act === 'ad') {
        if (op === 'reject' && !confirm('Reject this ad?')) return;
        return afterAction(await call('post', 'adminAdAction', { adId: id, op: op }), 'Done');
      }
      if (act === 'ad-add') {
        const unl = $('nad-unl').checked;
        const res = await call('post', 'adminAddAd', { title: val('nad-title'), url: val('nad-url'), duration: val('nad-dur'), unlimited: unl, views: val('nad-views') });
        return afterAction(res, 'Ad added and live');
      }
      if (act === 'sl-new') {
        const r = await call('get', 'adminShortlinkNext');
        if (r && r.success) $('sl-new-box').innerHTML = renderNewLink(r); else if (r) toast(failMsg(r), false);
        return;
      }
      if (act === 'sl-create') {
        const res = await call('post', 'adminShortlinkSave', { linkId: id, title: val('nl-title'), shortUrl: val('nl-url'), reward: val('nl-rew'), status: 'active' });
        return afterAction(res, 'Shortlink saved');
      }
      if (act === 'sl-save') {
        const res = await call('post', 'adminShortlinkSave', { linkId: id, title: val('sl-title-' + id), shortUrl: val('sl-url-' + id), reward: val('sl-rew-' + id), status: b.dataset.status });
        return afterAction(res, 'Saved');
      }
      if (act === 'wall') {
        const res = await call('post', 'adminOfferwallUpdate', { wallId: id, status: b.dataset.status, tokenMultiplier: val('w-mult-' + id) });
        return afterAction(res, 'Saved');
      }
      if (act === 'user-search') { userQuery = val('u-q'); return showTab('users'); }
      if (act === 'user-ban') {
        const ask = { ban: 'Ban this user? He will not be able to log in or earn.', unban: 'Unban this user?', unlinkTelegram: 'Unlink his Telegram? He must connect Telegram again before withdrawing.' }[op];
        if (!confirm(ask)) return;
        return afterAction(await call('post', 'adminUserAction', { targetUserId: id, op: op }));
      }
      if (act === 'user-adjust') {
        const amount = val('adj-amt-' + id), reason = val('adj-why-' + id);
        if (!amount || !reason) return toast('Enter an amount and a reason.', false);
        if (!confirm('Change this user\'s balance by ' + amount + ' Token?')) return;
        return afterAction(await call('post', 'adminUserAction', { targetUserId: id, op: 'adjust', amount: amount, reason: reason }));
      }
    });
  });

  // start: also tells us straight away whether this account is an admin
  if (user) showTab('home');
</script>
</body>
</html>
