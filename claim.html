<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Claiming Reward — Vexora International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .claim-shell {
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .claim-card {
    max-width: 380px; width:100%; text-align:center;
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 36px 26px; box-shadow: var(--shadow-md);
  }
  .claim-icon { font-size: 3rem; margin-bottom: 14px; }
  .claim-spinner {
    width: 36px; height: 36px; margin: 0 auto 18px;
    border: 3px solid var(--surface-3); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="claim-shell">
  <div class="claim-card">
    <div id="state-loading">
      <div class="claim-spinner"></div>
      <h2 style="margin-bottom:6px;">Verifying your visit…</h2>
      <p style="color:var(--text-dim); font-size:0.88rem;">Please wait a moment, do not close this page.</p>
    </div>

    <div id="state-success" style="display:none;">
      <div class="claim-icon">🎉</div>
      <h2 style="color:var(--success); margin-bottom:6px;">Bonus Credited!</h2>
      <p id="success-amount" style="color:var(--gold); font-weight:700; font-size:1.3rem; margin-bottom:10px;"></p>
      <p style="color:var(--text-dim); font-size:0.85rem;">Taking you back to Shortlinks…</p>
    </div>

    <div id="state-error" style="display:none;">
      <div class="claim-icon">⚠️</div>
      <h2 style="color:var(--danger); margin-bottom:6px;">Couldn't Credit Reward</h2>
      <p id="error-text" style="color:var(--text-dim); font-size:0.88rem; margin-bottom:18px;"></p>
      <a href="earn-shortlinks.html" class="btn btn-outline btn-block">Back to Shortlinks</a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  (async function () {
    const session = getSession();
    if (!session || !session.token) {
      // Not logged in (e.g. opened in a browser/profile without a session) —
      // send them to log in, then back here with the same link id.
      const linkId = new URLSearchParams(window.location.search).get('linkId') || '';
      window.location.href = 'index.html?returnTo=' + encodeURIComponent('claim.html?linkId=' + linkId);
      return;
    }

    const linkId = new URLSearchParams(window.location.search).get('linkId');
    if (!linkId) {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-error').style.display = 'block';
      document.getElementById('error-text').innerText = 'Missing link reference.';
      return;
    }

    try {
      const res = await apiPost('completeShortlink', { linkId });
      document.getElementById('state-loading').style.display = 'none';

      if (res.success) {
        document.getElementById('state-success').style.display = 'block';
        document.getElementById('success-amount').innerText = '+' + formatTokens(res.reward);
        setTimeout(() => { window.location.href = 'earn-shortlinks.html'; }, 2500);
      } else {
        document.getElementById('state-error').style.display = 'block';
        document.getElementById('error-text').innerText = res.error || 'Something went wrong.';
      }
    } catch (err) {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-error').style.display = 'block';
      document.getElementById('error-text').innerText = 'Network error, please try again.';
    }
  })();
</script>

</body>
</html>
