<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — Vexora International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <div class="top-nav">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="balance-pill">
      <span class="balance-icon">💰</span>
      <div>
        <div class="label">Balance</div>
        <div class="amount" id="balance-amount">0 Token</div>
      </div>
    </div>
  </div>

  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-close" onclick="toggleMenu()">✕</div>
    <div class="drawer-user">
      <img id="user-pic" src="https://api.dicebear.com/7.x/initials/svg?seed=U" alt="">
      <div>
        <div class="drawer-user-name" id="user-name">User</div>
        <div class="drawer-user-email" id="user-email">—</div>
      </div>
    </div>

    <div class="logo">Vexora <span>Intl.</span></div>
    <div class="tagline">Earning Platform</div>


    <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span class="label">Home</span></a>
    <a class="nav-item" href="earn-hub.html"><span class="icon">💎</span><span class="label">Earn Money</span></a>
    <a class="nav-item" href="withdraw.html"><span class="icon">💳</span><span class="label">Withdrawal System</span></a>
    <a class="nav-item" href="advertising.html"><span class="icon">📢</span><span class="label">Advertising Board</span></a>
    <a class="nav-item" href="referrals.html"><span class="icon">🤝</span><span class="label">Referral Program</span></a>
    <a class="nav-item" href="prize-pool.html"><span class="icon">🏆</span><span class="label">Weekly Prize Pool</span></a>

    <div class="drawer-footer">
      <a class="nav-item" href="#" onclick="clearSession(); window.location.href='index.html';">
        <span class="icon">🚪</span><span class="label">Logout</span>
      </a>
    </div>
  </aside>

  <div class="main-content">
    <div class="page-head">
      <h2>📜 History</h2>
      <p style="color:var(--text-dim); font-size:0.9rem;">Everything you earned, withdrew and paid — newest first.</p>
    </div>

    <div class="grid grid-2" style="margin-bottom:16px;">
      <div class="stat-card accent"><div class="stat-value" id="sum-earned">0 Token</div><div class="stat-label">Total earned</div></div>
      <div class="stat-card teal"><div class="stat-value" id="sum-withdrawn">0 Token</div><div class="stat-label">Total withdrawn (approved)</div></div>
    </div>

    <div id="filters" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;"></div>

    <div class="card" style="padding:6px 16px;">
      <div id="history-list"><div style="padding:18px 0; color:var(--text-dim); text-align:center;">Loading...</div></div>
    </div>
    <div style="text-align:center; margin-top:14px;">
      <button class="btn btn-outline" id="more-btn" style="display:none;" onclick="showMore()">Show more</button>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
  const user = requireLogin();

  // how each record type is shown (cat = which filter it belongs to)
  const TYPE_INFO = {
    ptc_earning:            { label: '🎬 PTC ad',               cat: 'earning' },
    faucet_earning:         { label: '💧 Faucet',               cat: 'earning' },
    shortlink_earning:      { label: '🔗 Shortlink',            cat: 'earning' },
    offerwall_earning:      { label: '🎁 Offerwall',            cat: 'earning' },
    offerwall_chargeback:   { label: '↩️ Offerwall reversal',   cat: 'earning' },
    weekly_prize_pool:      { label: '🏆 Weekly prize',         cat: 'earning' },
    referral_signup_bonus:  { label: '🤝 Referral bonus',       cat: 'referral' },
    referral_commission_l1: { label: '🤝 Referral commission (L1)', cat: 'referral' },
    referral_commission_l2: { label: '🤝 Referral commission (L2)', cat: 'referral' },
    deposit:                { label: '📢 Ad payment',           cat: 'deposit' }
  };
  const FILTERS = [['all', 'All'], ['earning', 'Earnings'], ['referral', 'Referrals'], ['withdraw', 'Withdrawals'], ['deposit', 'Ad payments']];
  const PAGE = 50;
  let entries = [], filter = 'all', shown = PAGE;

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  if (user) {
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-email').innerText = user.email;
    document.getElementById('user-pic').src = user.picture || `https://api.dicebear.com/7.x/initials/svg?seed=${user.name}`;
    apiGet('getUserFull', { email: user.email }).then(res => {
      if (res.success) document.getElementById('balance-amount').innerText = formatTokens(res.user.Balance || 0);
    });
    renderFilters();
    load();
  }

  async function load() {
    const [t, w] = await Promise.all([
      apiGet('getTransactions', { userId: user.userId }),
      apiGet('getWithdrawals', { userId: user.userId })
    ]);
    entries = [];

    (t.success ? t.transactions : []).forEach(x => {
      if (x.Type === 'withdrawal') return;               // withdrawals are listed once, from the Withdrawals sheet
      const info = TYPE_INFO[x.Type] || { label: String(x.Type || 'Other'), cat: 'other' };
      entries.push({
        ts: new Date(x.Timestamp).getTime(), label: info.label, cat: info.cat,
        amount: Number(x.Amount) || 0, unit: x.Type === 'deposit' ? 'USDT' : 'Token',
        status: x.Status || 'Completed',
        detail: x.Type === 'deposit' ? (x.Method || '') : ''
      });
    });

    (w.success ? w.withdrawals : []).forEach(x => {
      const payout = x.PayoutValue ? Number(x.PayoutValue).toFixed(String(x.PayoutCurrency) === 'LTC' ? 6 : 2) + ' ' + (x.PayoutCurrency || '') : '';
      entries.push({
        ts: new Date(x.RequestedAt).getTime(), label: '💳 Withdrawal', cat: 'withdraw',
        amount: -(Number(x.TokenAmount) || 0), unit: 'Token', status: x.Status || 'Pending',
        detail: [x.Method, payout].filter(Boolean).join(' · ')
      });
    });

    entries.sort((a, b) => b.ts - a.ts);

    const earned = entries.filter(e => e.cat === 'earning' || e.cat === 'referral').reduce((s, e) => s + e.amount, 0);
    const withdrawn = entries.filter(e => e.cat === 'withdraw' && /^(approved|paid|completed)$/i.test(e.status)).reduce((s, e) => s - e.amount, 0);
    document.getElementById('sum-earned').innerText = formatTokens(earned);
    document.getElementById('sum-withdrawn').innerText = formatTokens(withdrawn);
    render();
  }

  function renderFilters() {
    document.getElementById('filters').innerHTML = FILTERS.map(([key, name]) =>
      `<button class="btn ${key === filter ? 'btn-gold' : 'btn-outline'}" style="padding:7px 14px; font-size:0.85rem;" onclick="setFilter('${key}')">${name}</button>`
    ).join('');
  }

  function setFilter(key) { filter = key; shown = PAGE; renderFilters(); render(); }
  function showMore() { shown += PAGE; render(); }

  function render() {
    const list = document.getElementById('history-list');
    const rows = entries.filter(e => filter === 'all' || e.cat === filter);
    if (!rows.length) {
      list.innerHTML = '<div style="padding:18px 0; color:var(--text-dim); text-align:center;">Nothing here yet.</div>';
      document.getElementById('more-btn').style.display = 'none';
      return;
    }
    list.innerHTML = rows.slice(0, shown).map(e => {
      const positive = e.amount >= 0;
      const amountText = (positive ? '+' : '−') + (e.unit === 'USDT' ? Math.abs(e.amount).toFixed(5) + ' USDT' : formatTokens(Math.abs(e.amount)));
      return `
      <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);">
        <div style="min-width:0;">
          <div style="font-weight:600;">${escapeHtml(e.label)}</div>
          <div style="font-size:0.78rem; color:var(--text-dim);">${new Date(e.ts).toLocaleString()}${e.detail ? ' · ' + escapeHtml(e.detail) : ''}</div>
        </div>
        <div style="text-align:right; flex-shrink:0;">
          <div style="font-weight:700; color:${positive ? 'var(--success)' : 'var(--danger)'};">${amountText}</div>
          <span class="status-pill status-${escapeHtml(String(e.status).toLowerCase())}" style="font-size:0.7rem;">${escapeHtml(e.status)}</span>
        </div>
      </div>`;
    }).join('');
    document.getElementById('more-btn').style.display = rows.length > shown ? 'inline-block' : 'none';
  }
</script>

</body>
</html>
