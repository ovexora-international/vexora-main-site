<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPAGrip Offers — Vexora International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  /* keep the CPAGrip widget inside the phone screen */
  #wall-box, #wall-box * { max-width: 100% !important; box-sizing: border-box; }
  #wall-box { word-wrap: break-word; }
  #wall-box table { width: 100% !important; }
</style>
</head>
<body>
<div class="main-content" style="max-width:760px; margin:0 auto; padding:16px;">
  <div class="page-head">
    <a href="earn-offerwalls.html" style="color:var(--text-dim); font-size:0.85rem;">← Back to Offerwalls</a>
    <h2 style="margin-top:8px;">🎁 CPAGrip Offers</h2>
    <p style="color:var(--text-dim); font-size:0.9rem;">Complete an offer below. Your reward is credited automatically after it is approved.</p>
  </div>

  <div class="card" id="wall-box" style="padding:12px; background:#FFFFFF !important; color:#111111 !important; overflow-x:auto; border-radius:14px;">
    <div id="wall-msg" style="color:#555555; text-align:center; font-size:0.85rem;">Loading offers...</div>
    <script src="config.js"></script>
    <script>
      // CPAGrip tool id (from your Offer Wall link: view.php?id=1917784)
      var CPAGRIP_TOOL_ID = '1917784';

      // The logged-in user's ID comes from the session, so it can't be
      // swapped for someone else's ID in the address bar.
      var session = getSession();
      if (!session || !session.token) {
        window.location.href = 'index.html';
      } else {
        var src = 'https://www.cpagrip.com/script_include.php?id=' + encodeURIComponent(CPAGRIP_TOOL_ID) +
                  '&tracking_id=' + encodeURIComponent(session.userId);
        // Written as a normal <script> tag while the page loads, exactly like
        // the embed code CPAGrip gives you (needed for document.write based widgets).
        document.write('<script src="' + src + '"><\/script>');
      }
    </script>
  </div>
</div>
<script>
  // hide the "Loading offers..." line once the page (and the CPAGrip widget) has loaded
  window.addEventListener('load', function () {
    var m = document.getElementById('wall-msg');
    if (m) m.style.display = 'none';
  });
</script>
</body>
</html>
